name: IMDb Vidmody Multi-Category Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00'da çalışır
  workflow_dispatch:      # Manuel tetikleme butonu

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Output Klasörünü Oluştur
        run: mkdir -p output

      - name: Kazıma İşlemini Başlat (Puppeteer + actors.txt)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scrape.js

      - name: M3U Dosyasını Repoya Kaydet ve İt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto update: Multi-category playlist updated [skip ci]" || exit 0
          git push
